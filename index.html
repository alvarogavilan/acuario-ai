<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#071825" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Acuario AI" />
  <title>Acuario AI · 130 L</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">ACUARIO AI</p>
        <h1>Reef 130 L</h1>
      </div>
      <button id="healthButton" class="health-chip" type="button" aria-label="Ver estado del acuario">
        <span class="health-dot"></span><span id="healthLabel">Evaluando</span>
      </button>
    </header>

    <main id="mainContent" class="content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button class="nav-item active" data-view="home"><span>⌂</span><small>Inicio</small></button>
      <button class="nav-item" data-view="livestock"><span>◉</span><small>Vida</small></button>
      <button class="nav-item" data-view="parameters"><span>⌁</span><small>Agua</small></button>
      <button class="nav-item" data-view="equipment"><span>⚙</span><small>Equipo</small></button>
      <button class="nav-item" data-view="advisor"><span>✦</span><small>IA</small></button>
    </nav>
  </div>

  <dialog id="measurementDialog" class="sheet">
    <form id="measurementForm" method="dialog">
      <div class="sheet-head">
        <div><p class="eyebrow">NUEVA MEDICIÓN</p><h2>Registrar parámetro</h2></div>
        <button type="button" class="icon-btn" data-close="measurementDialog">×</button>
      </div>
      <label>Parámetro<select id="measurementType" required></select></label>
      <label>Valor<input id="measurementValue" inputmode="decimal" type="number" step="any" required /></label>
      <label>Nota<input id="measurementNote" type="text" placeholder="Opcional" /></label>
      <button class="primary" type="submit">Guardar medición</button>
    </form>
  </dialog>

  <dialog id="maintenanceDialog" class="sheet">
    <form id="maintenanceForm" method="dialog">
      <div class="sheet-head">
        <div><p class="eyebrow">MANTENIMIENTO</p><h2>Registrar acción</h2></div>
        <button type="button" class="icon-btn" data-close="maintenanceDialog">×</button>
      </div>
      <label>Acción<select id="maintenanceType" required>
        <option value="Cambio de agua">Cambio de agua</option>
        <option value="Sifonado parcial">Sifonado parcial</option>
        <option value="Limpieza prefiltro EHEIM">Limpieza prefiltro EHEIM</option>
        <option value="Limpieza cristal">Limpieza cristal</option>
        <option value="Limpieza bomba">Limpieza bomba</option>
        <option value="Revisión skimmer">Revisión skimmer</option>
        <option value="Otro">Otro</option>
      </select></label>
      <label>Detalle<input id="maintenanceDetail" type="text" placeholder="Ej.: 10 L + zona derecha" /></label>
      <button class="primary" type="submit">Guardar mantenimiento</button>
    </form>
  </dialog>

  <dialog id="entityDialog" class="sheet detail-sheet">
    <div id="entityDialogContent"></div>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
