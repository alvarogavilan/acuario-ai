name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          for f in app.js enhancements.js individuals.js experts.js catalog-v07.js commerce.js budget.js installations.js director.js sourcing.js virtual-reef.js candidate-lab.js water-intelligence.js proposals.js market-intelligence.js recovery-v16.js sw.js; do node --check "$f"; done
      - name: Validate JSON
        run: |
          python -m json.tool data/aquarium.json >/dev/null
          python -m json.tool data/market.json >/dev/null
          python -m json.tool manifest.webmanifest >/dev/null
      - name: Validate aquarium runtime schema
        run: |
          node - <<'NODE'
          const d=require('./data/aquarium.json');
          for(const k of ['aquarium','livestock','equipment','parameters','automation','risks']) if(!d[k]) throw new Error('Missing '+k);
          if(!Array.isArray(d.parameters)||d.parameters.length<4) throw new Error('Invalid parameters');
          if(!d.automation.nero5||!d.automation.lighting) throw new Error('Invalid automation');
          NODE
      - name: Verify required files
        run: |
          for f in index.html styles.css sw.js director.js installations.js commerce.js sourcing.js virtual-reef.js virtual-reef.css candidate-lab.js candidate-lab.css water-intelligence.js proposals.js market-intelligence.js recovery-v16.js; do test -f "$f"; done