name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check enhancements.js
          node --check individuals.js
      - name: Validate JSON
        run: |
          python -m json.tool data/aquarium.json >/dev/null
          python -m json.tool data/market.json >/dev/null
          python -m json.tool manifest.webmanifest >/dev/null
      - name: Verify required files
        run: test -f index.html && test -f styles.css && test -f sw.js && test -f enhancements.js && test -f individuals.js
