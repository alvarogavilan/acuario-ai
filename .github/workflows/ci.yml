name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          for f in app.js enhancements.js individuals.js experts.js catalog-v07.js commerce.js budget.js installations.js director.js sourcing.js virtual-reef.js sw.js; do
            node --check "$f"
          done
      - name: Validate JSON
        run: |
          python -m json.tool data/aquarium.json >/dev/null
          python -m json.tool data/market.json >/dev/null
          python -m json.tool manifest.webmanifest >/dev/null
      - name: Validate aquarium runtime schema
        run: |
          node - <<'NODE'
          const d=require('./data/aquarium.json');
          const required=['aquarium','livestock','equipment','parameters','automation','risks'];
          for(const k of required){if(!d[k]) throw new Error('Missing '+k)}
          if(!Array.isArray(d.parameters)||d.parameters.length<4) throw new Error('Invalid parameters');
          if(!d.automation.nero5||!d.automation.lighting) throw new Error('Invalid automation');
          console.log('runtime schema ok');
          NODE
      - name: Verify required files
        run: |
          test -f index.html && test -f styles.css && test -f sw.js
          test -f director.js && test -f director.css
          test -f installations.js && test -f commerce.js
          test -f sourcing.js && test -f sourcing.css
          test -f virtual-reef.js && test -f virtual-reef.css
